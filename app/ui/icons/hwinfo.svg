<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="infoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Chip Outline / Pins -->
  <rect x="8" y="8" width="32" height="32" rx="6" fill="url(#chipBg)" stroke="#334155" stroke-width="2"/>
  <!-- Pins Left/Right/Top/Bottom -->
  <line x1="4" y1="16" x2="8" y2="16" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="24" x2="8" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="8" y2="32" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="16" x2="44" y2="16" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="44" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="44" y2="32" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="4" x2="16" y2="8" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="4" x2="24" y2="8" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="4" x2="32" y2="8" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Diagnostic trace -->
  <path d="M12 28l4-8 4 12 3-8 3 4h4" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "HW" letters -->
  <text x="14" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="url(#hwGold)" letter-spacing="-0.5">HW</text>
  <!-- "i" Info circle badge in bottom right -->
  <circle cx="33" cy="33" r="5.5" fill="url(#infoBlue)"/>
  <text x="33" y="36.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle">i</text>
</svg>